<div class="card">
    <div class="card-head">
        <h1>
            HEROES DRAGON BALL
        </h1>
        <div class="card-body">
            <div class="row">
                <div class="col-md-2">
                    Filtrar por:
                </div>
                <div class="col-md-4">
                    <input [(ngModel)]="listFilter" type="text" class="form-control"
                    placeholder="Ingrese nombre de Heroe">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <h3>Filtro: {{listFilter}}</h3>
                </div>
            </div>

            <p *ngIf="cargando">Cargando personajes...</p>
            <p *ngIf="error">{{ error }}</p>

            <div class="table-responsive">
                <table class="table table-striped table-hover" *ngIf="heroes.length > 0">
                    <thead>
                        <tr>
                            <th><button (click)="showImage()" class="btn btn-primary">
                                {{muestraImage?'Ocultar':'Muestra'}} Imagen</button></th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Raza</th>
                            <th>Ki</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let heroe of heroes | heroesFilter:listFilter">
                            <td><img *ngIf="muestraImage" [src]="heroe.imagen"
                                [style.width.px]="imageWidth"
                                [style.margin.px]="imageMargin"></td>
                            <td>{{heroe.nombre}}</td>
                            <td>{{heroe.descripcion | slice:0:120}}...</td>
                            <td>{{heroe.race}}</td>
                            <td>{{heroe.Ki}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
